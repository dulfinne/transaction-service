spring:
  application:
    name: transaction-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/}transaction_db
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:29092

  cloud:
    function:
      definition: receiveTransactionMessage
    stream:
      function:
        bindings:
          receiveTransactionMessage-in-0: input
        autodetect: false
      bindings:
        input:
          destination: transaction-topic
          binder: kafka
          error-handler-definition: myErrorHandler
          group: transaction-message-group
      binders:
        kafka:
          environment:
            spring:
              kafka:
                bootstrap-servers: localhost:29092

      default-binder: kafka

grpc:
  server:
    port: 9090

app:
  common:
    single-flight:
      enabled: true

server:
  port: 8092
