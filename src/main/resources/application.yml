spring:
  application:
    name: virtual-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PG_URLS:jdbc:postgresql://localhost:5432/}transaction_db
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8092
